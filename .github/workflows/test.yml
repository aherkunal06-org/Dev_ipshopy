name: Test Build and Deploy

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: [self-hosted, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, gd, zip, curl, mbstring

      - name: Create deployment directory
        run: |
          sudo mkdir -p /var/www/html/test-ipshopy
          sudo chown -R $USER:$USER /var/www/html/test-ipshopy

      - name: Deploy files
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'storage_dev_ipshopy/logs/*' \
            --exclude 'storage_dev_ipshopy/cache/*' \
            --exclude 'storage_dev_ipshopy/session/*' \
            ./ /var/www/html/test-ipshopy/

      - name: Install Composer dependencies
        run: |
          cd /var/www/html/test-ipshopy
          composer install --no-dev --optimize-autoloader

      - name: Generate config.php
        run: |
          cat > /var/www/html/test-ipshopy/config.php << 'EOF'
          <?php
          // HTTP
          define('HTTP_SERVER', 'http://localhost/test-ipshopy/');

          // HTTPS
          define('HTTPS_SERVER', 'http://localhost/test-ipshopy/');

          // DIR
          define('DIR_APPLICATION', '/var/www/html/test-ipshopy/catalog/');
          define('DIR_SYSTEM', '/var/www/html/test-ipshopy/system/');
          define('DIR_IMAGE', '/var/www/html/test-ipshopy/image/');
          define('DIR_STORAGE', '/var/www/html/test-ipshopy/storage_dev_ipshopy/');
          define('DIR_LANGUAGE', DIR_APPLICATION . 'language/');
          define('DIR_TEMPLATE', DIR_APPLICATION . 'view/theme/');
          define('DIR_CONFIG', DIR_SYSTEM . 'config/');
          define('DIR_CACHE', DIR_STORAGE . 'cache/');
          define('DIR_DOWNLOAD', DIR_STORAGE . 'download/');
          define('DIR_LOGS', DIR_STORAGE . 'logs/');
          define('DIR_MODIFICATION', DIR_STORAGE . 'modification/');
          define('DIR_SESSION', DIR_STORAGE . 'session/');
          define('DIR_UPLOAD', DIR_STORAGE . 'upload/');

          // DB
          define('DB_DRIVER', 'mysqli');
          define('DB_HOSTNAME', 'localhost');
          define('DB_USERNAME', 'root');
          define('DB_PASSWORD', '');
          define('DB_DATABASE', 'test_ipshopy');
          define('DB_PORT', '3306');
          define('DB_PREFIX', 'oc_');
          EOF

      - name: Generate admin/config.php
        run: |
          cat > /var/www/html/test-ipshopy/admin/config.php << 'EOF'
          <?php
          // HTTP
          define('HTTP_SERVER', 'http://localhost/test-ipshopy/admin/');
          define('HTTP_CATALOG', 'http://localhost/test-ipshopy/');

          // HTTPS
          define('HTTPS_SERVER', 'http://localhost/test-ipshopy/admin/');
          define('HTTPS_CATALOG', 'http://localhost/test-ipshopy/');

          // DIR
          define('DIR_APPLICATION', '/var/www/html/test-ipshopy/admin/');
          define('DIR_SYSTEM', '/var/www/html/test-ipshopy/system/');
          define('DIR_IMAGE', '/var/www/html/test-ipshopy/image/');
          define('DIR_STORAGE', '/var/www/html/test-ipshopy/storage_dev_ipshopy/');
          define('DIR_CATALOG', '/var/www/html/test-ipshopy/catalog/');
          define('DIR_LANGUAGE', DIR_APPLICATION . 'language/');
          define('DIR_TEMPLATE', DIR_APPLICATION . 'view/template/');
          define('DIR_CONFIG', DIR_SYSTEM . 'config/');
          define('DIR_CACHE', DIR_STORAGE . 'cache/');
          define('DIR_DOWNLOAD', DIR_STORAGE . 'download/');
          define('DIR_LOGS', DIR_STORAGE . 'logs/');
          define('DIR_MODIFICATION', DIR_STORAGE . 'modification/');
          define('DIR_SESSION', DIR_STORAGE . 'session/');
          define('DIR_UPLOAD', DIR_STORAGE . 'upload/');

          // DB
          define('DB_DRIVER', 'mysqli');
          define('DB_HOSTNAME', 'localhost');
          define('DB_USERNAME', 'root');
          define('DB_PASSWORD', '');
          define('DB_DATABASE', 'test_ipshopy');
          define('DB_PORT', '3306');
          define('DB_PREFIX', 'oc_');

          // OpenCart API
          define('OPENCART_SERVER', 'https://www.opencart.com/');
          EOF

      - name: Set permissions
        run: |
          sudo chown -R www-data:www-data /var/www/html/test-ipshopy
          sudo chmod -R 755 /var/www/html/test-ipshopy
          sudo chmod -R 777 /var/www/html/test-ipshopy/storage_dev_ipshopy
          sudo chmod -R 777 /var/www/html/test-ipshopy/image

      - name: Restart Apache
        run: |
          sudo systemctl restart apache2

      - name: Deployment complete
        run: |
          echo "✅ Test deployment complete!"
          echo "🌐 Access at: http://localhost/test-ipshopy/"
