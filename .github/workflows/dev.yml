name: Dev Build and Deploy

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: [self-hosted, dev]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean and setup deployment directory
        run: |
          rm -rf /var/www/html/dev.ipshopy/* 2>/dev/null || true
          mkdir -p /var/www/html/dev.ipshopy

      - name: Deploy files
        run: |
          cp -rf ./* /var/www/html/dev.ipshopy/
          cp -rf ./.htaccess /var/www/html/dev.ipshopy/ 2>/dev/null || true

      - name: Install Composer dependencies
        run: |
          cd /var/www/html/dev.ipshopy
          composer install --no-dev --optimize-autoloader

      - name: Generate config.php
        run: |
          cat << 'EOF' > /var/www/html/dev.ipshopy/config.php
          <?php
          define("HTTP_SERVER", "http://localhost/dev.ipshopy/");
          define("HTTPS_SERVER", "http://localhost/dev.ipshopy/");

          define("DIR_APPLICATION", "/var/www/html/dev.ipshopy/catalog/");
          define("DIR_SYSTEM", "/var/www/html/dev.ipshopy/system/");
          define("DIR_IMAGE", "/var/www/html/dev.ipshopy/image/");
          define("DIR_STORAGE", "/var/www/html/dev.ipshopy/storage_dev_ipshopy/");
          define("DIR_LANGUAGE", DIR_APPLICATION . "language/");
          define("DIR_TEMPLATE", DIR_APPLICATION . "view/theme/");
          define("DIR_CONFIG", DIR_SYSTEM . "config/");
          define("DIR_CACHE", DIR_STORAGE . "cache/");
          define("DIR_DOWNLOAD", DIR_STORAGE . "download/");
          define("DIR_LOGS", DIR_STORAGE . "logs/");
          define("DIR_MODIFICATION", DIR_STORAGE . "modification/");
          define("DIR_SESSION", DIR_STORAGE . "session/");
          define("DIR_UPLOAD", DIR_STORAGE . "upload/");

          define("DB_DRIVER", "mysqli");
          define("DB_HOSTNAME", "127.0.0.1");
          define("DB_USERNAME", "root");
          define("DB_PASSWORD", "root123");
          define("DB_DATABASE", "dev_ipshopy");
          define("DB_PORT", "3306");
          define("DB_PREFIX", "oc_");
          EOF

      - name: Generate admin/config.php
        run: |
          cat << 'EOF' > /var/www/html/dev.ipshopy/admin/config.php
          <?php
          define("HTTP_SERVER", "http://localhost/dev.ipshopy/admin/");
          define("HTTP_CATALOG", "http://localhost/dev.ipshopy/");
          define("HTTPS_SERVER", "http://localhost/dev.ipshopy/admin/");
          define("HTTPS_CATALOG", "http://localhost/dev.ipshopy/");

          define("DIR_APPLICATION", "/var/www/html/dev.ipshopy/admin/");
          define("DIR_SYSTEM", "/var/www/html/dev.ipshopy/system/");
          define("DIR_IMAGE", "/var/www/html/dev.ipshopy/image/");
          define("DIR_STORAGE", "/var/www/html/dev.ipshopy/storage_dev_ipshopy/");
          define("DIR_CATALOG", "/var/www/html/dev.ipshopy/catalog/");
          define("DIR_LANGUAGE", DIR_APPLICATION . "language/");
          define("DIR_TEMPLATE", DIR_APPLICATION . "view/template/");
          define("DIR_CONFIG", DIR_SYSTEM . "config/");
          define("DIR_CACHE", DIR_STORAGE . "cache/");
          define("DIR_DOWNLOAD", DIR_STORAGE . "download/");
          define("DIR_LOGS", DIR_STORAGE . "logs/");
          define("DIR_MODIFICATION", DIR_STORAGE . "modification/");
          define("DIR_SESSION", DIR_STORAGE . "session/");
          define("DIR_UPLOAD", DIR_STORAGE . "upload/");

          define("DB_DRIVER", "mysqli");
          define("DB_HOSTNAME", "127.0.0.1");
          define("DB_USERNAME", "root");
          define("DB_PASSWORD", "root123");
          define("DB_DATABASE", "dev_ipshopy");
          define("DB_PORT", "3306");
          define("DB_PREFIX", "oc_");

          define("OPENCART_SERVER", "https://www.opencart.com/");
          EOF

      - name: Fix permissions for Apache
        run: |
          chown -R www-data:www-data /var/www/html/dev.ipshopy
          chmod -R 755 /var/www/html/dev.ipshopy
          chmod -R 775 /var/www/html/dev.ipshopy/storage_dev_ipshopy
          chmod -R 775 /var/www/html/dev.ipshopy/storage_dev_ipshopy/logs
          chmod -R 775 /var/www/html/dev.ipshopy/storage_dev_ipshopy/cache
          chmod -R 775 /var/www/html/dev.ipshopy/storage_dev_ipshopy/modification
          chmod -R 775 /var/www/html/dev.ipshopy/storage_dev_ipshopy/session
          chmod -R 775 /var/www/html/dev.ipshopy/storage_dev_ipshopy/upload

      - name: Restart Apache
        run: |
          systemctl restart apache2

      - name: Deployment complete
        run: |
          echo "✅ Dev deployment complete!"
          echo "🌐 Access at: http://localhost/dev.ipshopy/"
